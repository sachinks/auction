[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings
markers =
    unit: Pure unit tests with no DB access
    integration: Tests that hit the database
    views: HTTP / view layer tests
    fixtures_svc: Pool and fixture service logic
    jersey: Jersey management
